# Makes a GitHub release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# Checks the tag against the extension's and the MCP server's package.json, typechecks, builds,
# packages the extension (Windows x64, since REDbridge is Windows only) and makes the GitHub release
# with the vsix, the MCP server as one file, and the version's section of docs/changelog.md
# (tools/release/notes.mjs; it stops here when there is none). Versions before 1.0 are marked
# pre-release. No Marketplace, Open VSX or npm until M7 (docs/progress.md, "Decisions").
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: The tag matches both packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          for dir in extensions/edgemat packages/edgemat-mcp; do
            have=$(node -p "require('./${dir}/package.json').version")
            if [ "${have}" != "${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match ${dir}/package.json version ${have}"
              exit 1
            fi
          done
          {
            echo "VERSION=${version}"
            echo "VSIX=${GITHUB_WORKSPACE}/dist/edgemat-${version}.vsix"
            echo "MCP=${GITHUB_WORKSPACE}/dist/edgemat-mcp-${version}.cjs"
          } >> "$GITHUB_ENV"

      - name: Release notes from docs/changelog.md
        run: node tools/release/notes.mjs "${VERSION}" --out "${RUNNER_TEMP}/notes.md"

      - run: npm ci

      - run: npm run typecheck

      - name: Package
        run: |
          mkdir -p dist
          npm run mcp:build
          cp packages/edgemat-mcp/dist/server.cjs "${MCP}"
          cd extensions/edgemat
          "${GITHUB_WORKSPACE}/node_modules/.bin/vsce" package --no-dependencies --target win32-x64 --out "${VSIX}"
          cd "${GITHUB_WORKSPACE}"
          # The Nexus Mods file (nexus/README.md); it also writes dist/THIRD-PARTY-NOTICES.txt.
          node tools/release/nexus-zip.mjs

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${VERSION}" in 0.*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" "${VSIX}" "${MCP}" "dist/EDGEmat-${VERSION}-nexus.zip" dist/THIRD-PARTY-NOTICES.txt --title "EDGEmat ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" ${pre}
